,"improve":"cải thiện","include":"bao gồm","increase":"tăng","influence":"ảnh hưởng","information":"thông tin","inspire":"truyền cảm hứng","interest":"mối quan tâm","invent":"phát minh","invest":"đầu tư","investigate":"điều tra","involve":"liên quan","issue":"vấn đề","job":"công việc","join":"tham gia","judge":"phán xét","keep":"giữ","kind":"tử tế","language":"ngôn ngữ","large":"lớn","leader":"lãnh đạo","learn":"học","library":"thư viện","life":"cuộc sống","limit":"giới hạn","listen":"lắng nghe","local":"địa phương","lose":"mất","luck":"may mắn","main":"chính","maintain":"duy trì","major":"lớn","manage":"quản lý","matter":"vấn đề","media":"truyền thông","medical":"y tế","meet":"gặp gỡ","method":"phương pháp","modern":"hiện đại","money":"tiền bạc","move":"di chuyển","national":"quốc gia","natural":"tự nhiên","need":"cần thiết","negative":"tiêu cực","news":"tin tức","normal":"bình thường","ocean":"đại dương","offer":"đề nghị","opinion":"ý kiến","organize":"tổ chức","original":"nguyên bản","pain":"đau đớn","particular":"cụ thể","peace":"hòa bình","perform":"biểu diễn","period":"thời kỳ","person":"người","plan":"kế hoạch","play":"chơi","popular":"phổ biến","population":"dân số","positive":"tích cực","potential":"tiềm năng","practice":"thực hành","present":"hiện tại","prevent":"ngăn ngừa","primary":"chính yếu","principle":"nguyên tắc","private":"riêng tư","process":"quá trình","produce":"sản xuất","program":"chương trình","property":"tài sản","provide":"cung cấp","public":"công cộng","purpose":"mục đích","quality":"chất lượng","question":"câu hỏi","range":"phạm vi","reach":"đạt được","read":"đọc","reason":"lý do","recognize":"nhận ra","reflect":"suy nghĩ","region":"khu vực","relationship":"mối quan hệ","religion":"tôn giáo","rely":"phụ thuộc","remove":"loại bỏ","report":"báo cáo","require":"yêu cầu","respect":"tôn trọng","respond":"phản hồi","result":"kết quả","reveal":"tiết lộ","rise":"tăng lên","risk":"rủi ro","role":"vai trò","rule":"quy tắc","safe":"an toàn","save":" const SKIP=new Set("absorb,academic,curriculum,elaborate,evaluate,facilitate,scholarship,tuition,biodiversity,contaminate,deforestation,emission,renewable,sustainable,ecosystem,algorithm,artificial,automate,cybersecurity,database,innovation,virtual,chronic,diagnose,epidemic,immunise,nutrition,obesity,authentic,heritage,indigenous,multicultural,tradition,diversity,achieve,benefit,collaborate,consequence,demand,efficient,emerge,global,implement,inevitable,infrastructure,initiative,minority,motivate,overcome,phenomenon,pollute,poverty,preserve,promote,reliable,significant,strategy,sufficient,transform,widespread,ability,adapt,aware,challenge,communicate,concern,contribute,create,cultural,decline,determined,effective,environment,explore,generate,impact,opportunity,reduce,research,solution,achievement,analysis,attitude,concentrate,discipline,effort,intelligence,knowledge,participate,succeed,atmosphere,collapse,consume,crisis,damage,flood,protect,species,waste,wildlife,accurate,application,device,network,software,disease,mental,recover,stress,community".split(','));

const TOPIC={education:["school","learn","study","exam","teach","class","student","academic","course","degree","lecture","university","grade","assignment","curriculum"],environment:["environment","climate","nature","forest","ocean","wild","eco","sustain","pollut","recycle","carbon","emission","species","habitat","flood","drought"],technology:["tech","digital","computer","internet","software","data","network","device","robot","algorithm","cyber","virtual","online","electronic","program"],health:["health","medical","doctor","hospital","disease","medicine","diet","exercise","mental","cancer","virus","therapy","surgery","physical","immune"],culture:["culture","tradition","heritage","language","religion","society","community","festival","ceremony","identity","art","music","custom"]};

function getTopic(w){
  for(const[t,words]of Object.entries(TOPIC)){
    if(words.some(k=>w.includes(k)))return t;
  }
  return "education";
}

function go(){
  const text=document.getElementById('inp').value;
  if(!text.trim()){alert('Vui lòng dán nội dung Oxford 3000!');return;}
  
  const posMap={"n.":"noun","v.":"verb","adj.":"adjective","adv.":"adverb","prep.":"preposition","conj.":"conjunction","pron.":"pronoun","det.":"determiner","modal v.":"modal verb","exclam.":"exclamation","number":"noun","indefinite article":"determiner","definite article":"determiner"};
  
  const seen=new Set(SKIP);
  const results=[];
  let id=111;
  
  for(const line of text.split('\n')){
    const t=line.trim();
    if(!t||t.startsWith('©')||t.startsWith('The Oxford'))continue;
    
    const m=t.match(/^([a-z][a-z\s\-']{0,20}?)\s+(n\.|v\.|adj\.|adv\.|prep\.|conj\.|pron\.|det\.|modal v\.|exclam\.|number|indefinite article|definite article).*?(A1|A2|B1|B2)/i);
    if(!m)continue;
    
    const word=m[1].trim().toLowerCase();
    if(seen.has(word)||word.length<2)continue;
    seen.add(word);
    
    const pos=posMap[m[2].trim()]||'noun';
    const level=m[3];
    const meaning_vn=VN[word]||'(đang cập nhật)';
    const topic=getTopic(word);
    
    results.push(`  {id:${id++},word:"${word}",pos:"${pos}",ipa:"",level:"${level}",topic:"${topic}",meaning_vn:"${meaning_vn}",meaning_en:"",collocations:[],examples:[],synonyms:[]}`);
  }
  
  const out=`// Oxford 3000 Auto-Generated - ${results.length} words\nconst VOCAB_OXFORD=[\n${results.join(',\n')}\n];\nif(typeof VOCABULARY!=='undefined')VOCABULARY.push(...VOCAB_OXFORD);\n`;
  document.getElementById('out').value=out;
  document.getElementById('stats').textContent=`✅ Tạo thành công ${results.length} từ! Hãy copy và lưu vào js/data-oxford.js`;
}

function cp(){
  const el=document.getElementById('out');
  el.select();
  document.execCommand('copy');
  alert('Đã copy! Paste vào file js/data-oxford.js');
}
